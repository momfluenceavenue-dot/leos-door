<script>
  // Set up diagnostics BEFORE any library scripts load, so onload/onerror always have
  // something safe to call no matter how fast or slow each script loads.
  window.__loadStatus = { react: null, reactDom: null, babel: null, stripe: null, jspdf: null };
  window.__updateStatus = function () {
    const panel = document.getElementById('status-panel');
    if (!panel) return; // body hasn't parsed yet — updateStatus() gets called again later
    const s = window.__loadStatus;
    const anyFailed = Object.values(s).some(v => v === false);
    if (!anyFailed) return; // silent while things are loading normally — nothing to show a customer
    const label = (name, val) => name + ': ' + (val === null ? 'loading...' : val ? '\u2705 loaded' : '\u274c FAILED');
    panel.innerHTML =
      label('React', s.react) + ' | ' +
      label('ReactDOM', s.reactDom) + ' | ' +
      label('Babel', s.babel) + ' | ' +
      label('Stripe', s.stripe) + ' | ' +
      label('jsPDF', s.jspdf) +
      '<br>Something failed to load — screenshot this bar and send it over.';
    panel.style.display = 'block';
    panel.style.background = '#3a0a0a';
    panel.style.color = '#ff8888';
  };
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin onload="window.__loadStatus.react=true;window.__updateStatus()" onerror="window.__loadStatus.react=false;window.__updateStatus()"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin onload="window.__loadStatus.reactDom=true;window.__updateStatus()" onerror="window.__loadStatus.reactDom=false;window.__updateStatus()"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onload="window.__loadStatus.babel=true;window.__updateStatus()" onerror="window.__loadStatus.babel=false;window.__updateStatus()"></script>
<script src="https://js.stripe.com/v3/" onload="window.__loadStatus.stripe=true;window.__updateStatus()" onerror="window.__loadStatus.stripe=false;window.__updateStatus()"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onload="window.__loadStatus.jspdf=true;window.__updateStatus()" onerror="window.__loadStatus.jspdf=false;window.__updateStatus()"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', sans-serif; }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }

  @keyframes flipNext {
    0%   { transform: perspective(1200px) rotateY(0deg); }
    50%  { transform: perspective(1200px) rotateY(-95deg); filter: brightness(0.7); }
    51%  { filter: brightness(0.7); }
    100% { transform: perspective(1200px) rotateY(0deg); filter: brightness(1); }
  }
  @keyframes flipPrev {
    0%   { transform: perspective(1200px) rotateY(0deg); }
    50%  { transform: perspective(1200px) rotateY(95deg); filter: brightness(0.7); }
    51%  { filter: brightness(0.7); }
    100% { transform: perspective(1200px) rotateY(0deg); filter: brightness(1); }
  }

  .book-spread.flip-next { animation: flipNext 0.55s ease-in-out; }
  .book-spread.flip-prev { animation: flipPrev 0.55s ease-in-out; }
</style>

function App() {
  const [step, setStep] = useState("welcome");

  const [selectedRooms, setSelectedRooms] = useState([]);

  // ── Checkout state ──
  const [shipping, setShipping] = useState({
    firstName: "", lastName: "", email: "",
    addressLine1: "", addressLine2: "", city: "", state: "", postCode: "", country: "US",
  });
  const [clientSecret, setClientSecret] = useState(null);
  const [paymentElement, setPaymentElement] = useState(null);
  const elementsRef = useRef(null);
  const paymentDivRef = useRef(null);
  const [orderStatus, setOrderStatus] = useState("idle"); // idle | processing | error
  const [orderError, setOrderError] = useState("");
  const [clientSecretDebug, setClientSecretDebug] = useState("");
  const [gelatoOrderId, setGelatoOrderId] = useState(null);
  const [digitalBookUrl, setDigitalBookUrl] = useState(null);
  const [doorOpened, setDoorOpened] = useState(false);
  const [previewPage, setPreviewPage] = useState(0);
  const [flipDir, setFlipDir] = useState(null);

  const audioCtxRef = useRef(null);
  const getAudioCtx = () => {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume();
    }
    return audioCtxRef.current;
  };

  const playPageTurnSound = () => {
    try {
      const ctx = getAudioCtx();

      const duration = 0.22;
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        const attack = Math.min(1, t / 0.22); // soft fade-in, no instant "smack"
        const decay = Math.pow(1 - t, 1.7);
        const envelope = attack * decay;
        data[i] = (Math.random() * 2 - 1) * envelope;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      // band-limit the noise so it sounds like a soft paper rustle, not static/spray
      const highpass = ctx.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = 900;
      const lowpass = ctx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 3000;
      lowpass.Q.value = 0.4;

      const gainNode = ctx.createGain();
      gainNode.gain.value = 0.16; // graceful, not a smack

      noise.connect(highpass);
      highpass.connect(lowpass);
      lowpass.connect(gainNode);
      gainNode.connect(ctx.destination);
      noise.start();
    } catch (e) { /* sound is a nice-to-have, never block on it */ }
  };

  const playDoorOpenSound = () => {
    try {
      const ctx = getAudioCtx();
      const fireChime = () => {
        const now = ctx.currentTime;
        // a soft ascending magical chime, like light sparkling as the door opens
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.value = freq;
          const gain = ctx.createGain();
          const start = now + i * 0.09;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.14, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.55);
        });
      };
      // On the very first sound of the session, the context may still be
      // "waking up" — wait for resume() to actually finish before scheduling
      // notes, otherwise they can get scheduled against a stale clock and
      // never audibly play.
      if (ctx.state !== "running") {
        ctx.resume().then(fireChime).catch(() => {});
      } else {
        fireChime();
      }
    } catch (e) { /* sound is a nice-to-have, never block on it */ }
  };

  const goToPreviewPage = (newPage) => {
    if (newPage < 0 || newPage >= bookPreview.length || newPage === previewPage) return;
    setFlipDir(newPage > previewPage ? "next" : "prev");
    playPageTurnSound();
    setPreviewPage(newPage);
    setTimeout(() => setFlipDir(null), 560);
  };

  const toggleRoom = (id) => {
    setSelectedRooms(prev =>
      prev.includes(id) ? prev.filter(r => r !== id) : (prev.length < 6 ? [...prev, id] : prev)
    );
  };

  const launchConfetti = () => {
    const pieces = Array.from({ length: 30 }, (_, i) => ({
      id: i, x: Math.random() * 100,
      color: ["#D4A017", "#C0392B", "#1B6B3A", "#6C3483", "#1A5276"][i % 5],
      delay: Math.random() * 1.5, dur: 2 + Math.random() * 2,
    }));
    setConfetti(pieces);
    setTimeout(() => setConfetti([]), 5000);
  };

  // Move from "review" into checkout: create the PaymentIntent, then mount Stripe's payment form
  const goToCheckout = () => {
    launchConfetti();
    setStep("checkout");
  };

  useEffect(() => {
    if (step !== "checkout" || clientSecret) return;

    fetch(`${CONFIG.BACKEND_URL}/create-payment-intent?_=${Date.now()}`, {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json", "Cache-Control": "no-store" },
      body: JSON.stringify({
        amount: CONFIG.PRICE_CENTS,
        currency: "usd",
        metadata: { childName: name, rooms: selectedRooms.join(","), power: power || "" },
      }),
    })
      .then(r => r.json())
      .then(data => {
        if (data.clientSecret) {
          setClientSecret(data.clientSecret);
          setClientSecretDebug(data.clientSecret.slice(0, 25));
        } else {
          setOrderError(data.error || "Could not start payment.");
          setOrderStatus("error");

  // Mount the Stripe Payment Element once we have a clientSecret and the div is ready

  const loadImageAsDataURL = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error("missing image: " + url);
    const blob = await res.blob();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  };

  // Crops a (data URL) image to exactly match a target aspect ratio, centered,
  // so it fills a panel cleanly without ever stretching or distorting.
  const cropImageToAspect = (dataUrl, targetW, targetH) => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const targetRatio = targetW / targetH;
        const srcRatio = img.width / img.height;
        let sx, sy, sw, sh;
        if (srcRatio > targetRatio) {
          // source is wider than needed — crop the sides
          sh = img.height;
          sw = sh * targetRatio;
          sy = 0;
          sx = (img.width - sw) / 2;
        } else {
          // source is taller than needed — crop top/bottom
          sw = img.width;
          sh = sw / targetRatio;
          sx = 0;
          sy = (img.height - sh) / 2;
        }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(targetW);
        canvas.height = Math.round(targetH);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  };

  const drawTextPage = (doc, title, bodyText, epigraph = null) => {
    doc.addPage([612, 612]);

      doc.setFont("times", "bold");
      doc.setFontSize(26);
      doc.text(title, 306, y, { align: "center" });
      y += 40;
    }
    if (epigraph) {
      doc.setFont("times", "italic");
      doc.setFontSize(15);
      doc.setTextColor(150, 110, 30);
      const epiLines = doc.splitTextToSize(epigraph, 460);
      doc.text(epiLines, 306, y, { align: "center" });
      y += epiLines.length * 20 + 20;
      doc.setTextColor(40, 30, 20);

    doc.setFont("times", "normal");
    doc.setFontSize(19);
    const lines = doc.splitTextToSize(bodyText, 480);
    doc.text(lines, 306, title ? y : 280, { align: "center" });

  const generateBookPdf = async () => {

    // 30-200 range — 34 is confirmed valid for this product.
    // Lulu confirmed hardcover minimum is 24 interior pages. We target 30 to
    // match the exact cover dimensions already confirmed via their API.
    const LULU_TARGET_PAGES = 30;
    let closingIndex = 0;
    while (doc.internal.getNumberOfPages() < LULU_TARGET_PAGES) {
      closingPages[closingIndex % closingPages.length]();
      closingIndex++;

    const finalPageCount = doc.internal.getNumberOfPages();
    return { blob: doc.output("blob"), pageCount: finalPageCount };

  const hexToRgb = (hex) => {
    const clean = (hex || "#6C3483").replace("#", "");

  // Builds the actual printed cover (back + spine + front) as its own PDF,

  const generateCoverPdf = async (pageCount) => {

              <div style={{ display: "flex", gap: 16, justifyContent: "center", marginBottom: 28 }}>
                {[
                  { id: "boy", label: "Boy", emoji: "👦" },
                  { id: "girl", label: "Girl", emoji: "👧" },
                ].map(opt => (
                  <button key={opt.id} onClick={() => setCharacter(opt.id)} style={{
                    flex: 1, maxWidth: 160,
                    background: character === opt.id ? "rgba(212,160,23,0.25)" : "rgba(255,255,255,0.05)",
                    border: character === opt.id ? "3px solid #D4A017" : "2px solid rgba(255,255,255,0.15)",
                    borderRadius: 20, padding: "24px 12px", cursor: "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center", gap: 10,
                    transition: "all 0.2s",
                  }}>
                    <div style={{ fontSize: 44 }}>{opt.emoji}</div>
                    <div style={{ fontFamily: "'Fredoka One', cursive", color: "#fff", fontSize: 16 }}>
                      {opt.label}
                    </div>
                  </button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <MagicBtn onClick={() => setStep("name")} color="#555">← Back</MagicBtn>
                <MagicBtn onClick={() => setStep("rooms")} disabled={!character}>
                  Next: Pick Your Rooms! →
                </MagicBtn>
              </div>
            </Card>
          </div>
        )}

        {step === "rooms" && (
          <div style={{ animation: "pop 0.4s ease-out" }}>
            <Card>
              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 48 }}>🗺️</div>
                <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 26, color: "#D4A017", margin: "8px 0" }}>
                  Pick Your Magical Rooms!
                </h2>
                <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 15, margin: 0 }}>
                  Choose <strong style={{ color: "#D4A017" }}>5-6 worlds</strong> for your book — {selectedRooms.length}/6 chosen
                </p>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 10, marginBottom: 24 }}>
                {ROOMS.filter(room => room.active).map(room => {
                  const sel = selectedRooms.includes(room.id);
                  const maxed = selectedRooms.length >= 6 && !sel;
                  return (
                    <button key={room.id} onClick={() => !maxed && toggleRoom(room.id)} style={{
                      background: sel ? `${room.color}cc` : "rgba(255,255,255,0.05)",
                      border: sel ? `2px solid ${room.color}` : "2px solid rgba(255,255,255,0.1)",
                      borderRadius: 16, padding: "14px 10px", cursor: maxed ? "not-allowed" : "pointer",
                      textAlign: "center", transition: "all 0.2s", opacity: maxed ? 0.4 : 1,
                      transform: sel ? "scale(1.03)" : "scale(1)",
                      boxShadow: sel ? `0 4px 16px ${room.color}66` : "none",
                    }}>
                      <div style={{ fontSize: 28 }}>{room.emoji}</div>
                      <div style={{ fontFamily: "'Fredoka One', cursive", fontSize: 13, color: "#fff", marginTop: 4 }}>{room.label}</div>
                      {sel && <div style={{ fontSize: 16, marginTop: 2 }}>✓</div>}
                    </button>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <MagicBtn onClick={() => setStep("character")} color="#555">← Back</MagicBtn>
                <MagicBtn onClick={() => setStep("power")} disabled={selectedRooms.length < 5}>
                  Next: Choose Your Power! →
                </MagicBtn>
              </div>
            </Card>
          </div>
        )}

        {step === "power" && (
          <div style={{ animation: "pop 0.4s ease-out" }}>
            <Card>
              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 52 }}>🪄</div>
                <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 26, color: "#D4A017", margin: "8px 0" }}>
                  What's {name}'s Superpower?
                </h2>
                <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 15, margin: 0 }}>
                  Pick the one special gift that's all yours!
                </p>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 10, marginBottom: 24 }}>
                {POWERS.map(pw => {
                  const sel = power === pw.id;
                  return (
                    <button key={pw.id} onClick={() => setPower(pw.id)} style={{
                      background: sel ? `${pw.color}cc` : "rgba(255,255,255,0.05)",
                      border: sel ? `2px solid ${pw.color}` : "2px solid rgba(255,255,255,0.1)",
                      borderRadius: 16, padding: "16px 10px", cursor: "pointer",
                      textAlign: "center", transition: "all 0.2s",
                      transform: sel ? "scale(1.06)" : "scale(1)",
                      boxShadow: sel ? `0 4px 20px ${pw.color}66` : "none",
                    }}>
                      <div style={{ fontSize: 36 }}>{pw.emoji}</div>
                      <div style={{ fontFamily: "'Fredoka One', cursive", fontSize: 13, color: "#fff", marginTop: 4 }}>{pw.label}</div>
                      {sel && <div style={{ fontSize: 16, marginTop: 4 }}>✓</div>}
                    </button>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                <MagicBtn onClick={() => setStep("rooms")} color="#555">← Back</MagicBtn>
                <MagicBtn onClick={() => { setDoorOpened(false); setPreviewPage(0); setStep("review"); }} disabled={!power} color="#6C3483">
                  Preview My Book! →
                </MagicBtn>
              </div>
            </Card>
          </div>
        )}

        {step === "review" && !doorOpened && (
          <div style={{ textAlign: "center", animation: "pop 0.4s ease-out" }}>
            <Card glow>
              <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 16, marginBottom: 30 }}>
                {name}'s book is ready...
              </p>
              <button
                onClick={() => { launchConfetti(); playDoorOpenSound(); setDoorOpened(true); }}
                style={{
                  background: "transparent", border: "none", cursor: "pointer",
                  fontSize: 140, animation: "doorGlow 1.6s ease-in-out infinite, float 3s ease-in-out infinite",
                }}
              >
                🚪
              </button>
              <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 26, color: "#D4A017", margin: "20px 0 8px" }}>
                Tap the door to open it!
              </h2>
              <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 14 }}>
                See what's waiting for {name} inside...
              </p>
            </Card>
          </div>
        )}

        {step === "review" && doorOpened && (
          <div style={{ animation: "pop 0.4s ease-out" }}>
            <Card glow>
              <div style={{ textAlign: "center", marginBottom: 24 }}>
                <div style={{ fontSize: 52 }}>📖</div>
                <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 28, color: "#D4A017", margin: "8px 0" }}>
                  {name}'s Book Preview!
                </h2>
                <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 14, margin: 0 }}>
                  Here's a sneak peek of your adventure...
                </p>
              </div>

              <div style={{
                background: "linear-gradient(135deg, #1a0a2e, #0a1a2e)",
                borderRadius: 20, padding: "24px", marginBottom: 16,
                border: "2px solid rgba(212,160,23,0.5)",
                textAlign: "center",
                animation: "doorGlow 2s ease-in-out infinite",
              }}>
                <div style={{ fontSize: 40 }}>🚪</div>
                <div style={{ fontFamily: "'Fredoka One', cursive", fontSize: 26, color: "#D4A017" }}>{name}'s Door</div>
                <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 14, marginTop: 6 }}>
                  A magical adventure starring <strong style={{ color: "#fff" }}>{name}</strong>
                </div>
                <div style={{ marginTop: 10, fontSize: 20 }}>
                  {selectedPowerData?.emoji} &nbsp;
                  {selectedRoomData.slice(0, 4).map(r => r.emoji).join(" ")}
                </div>
              </div>

              <div style={{ marginBottom: 20 }}>
                <div style={{ textAlign: "center", marginBottom: 10 }}>
                  <span style={{ fontFamily: "'Fredoka One', cursive", fontSize: 14, color: "rgba(255,255,255,0.6)" }}>
                    📖 Flip through a sneak peek
                  </span>
                </div>

                <div
                  className={`book-spread${flipDir === "next" ? " flip-next" : flipDir === "prev" ? " flip-prev" : ""}`}
                  style={{
                    display: "flex",
                    minHeight: 220,
                    borderRadius: 18,
                    overflow: "hidden",
                    border: `2px solid ${bookPreview[previewPage].room.color}88`,
                    boxShadow: "0 10px 30px rgba(0,0,0,0.4)",
                  }}>
                  {/* left page */}
                  <div style={{
                    flex: "0 0 38%",
                    background: `linear-gradient(160deg, ${bookPreview[previewPage].room.color}55, ${bookPreview[previewPage].room.color}22)`,
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    padding: "18px 10px",
                    borderRight: "2px dashed rgba(255,255,255,0.15)",
                  }}>
                    <div style={{ fontSize: 46 }}>{bookPreview[previewPage].room.emoji}</div>
                    <div style={{ fontFamily: "'Fredoka One', cursive", fontSize: 13, color: "#fff", textAlign: "center", marginTop: 8 }}>
                      {bookPreview[previewPage].room.label}
                    </div>
                  </div>
                  {/* right page */}
                  <div style={{
                    flex: 1,
                    background: "rgba(255,255,255,0.06)",
                    padding: "20px 18px",
                    display: "flex",
                    flexDirection: "column",
                    justifyContent: "center",
                  }}>
                    <div style={{ fontFamily: "'Fredoka One', cursive", fontSize: 12, color: "rgba(255,255,255,0.5)", marginBottom: 8 }}>
                      Page {bookPreview[previewPage].pageNum}
                    </div>
                    <p style={{ margin: 0, fontSize: 14, color: "rgba(255,255,255,0.9)", lineHeight: 1.55 }}>
                      {bookPreview[previewPage].text}
                    </p>
                  </div>
                </div>

                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18, marginTop: 14 }}>
                  <button
                    onClick={() => goToPreviewPage(previewPage - 1)}
                    disabled={previewPage === 0}
                    style={{
                      background: "none", border: "none", cursor: previewPage === 0 ? "default" : "pointer",
                      fontSize: 26, color: previewPage === 0 ? "rgba(255,255,255,0.2)" : "#D4A017",
                    }}
                  >←</button>
                  <div style={{ display: "flex", gap: 6 }}>
                    {bookPreview.map((_, i) => (
                      <div key={i} onClick={() => goToPreviewPage(i)} style={{
                        width: i === previewPage ? 20 : 8, height: 8, borderRadius: 6,
                        background: i === previewPage ? "#D4A017" : "rgba(255,255,255,0.25)",
                        cursor: "pointer", transition: "all 0.3s",
                      }} />
                    ))}
                  </div>
                  <button
                    onClick={() => goToPreviewPage(previewPage + 1)}
                    disabled={previewPage === bookPreview.length - 1}
                    style={{
                      background: "none", border: "none", cursor: previewPage === bookPreview.length - 1 ? "default" : "pointer",
                      fontSize: 26, color: previewPage === bookPreview.length - 1 ? "rgba(255,255,255,0.2)" : "#D4A017",
                    }}
                  >→</button>
                </div>
              </div>

              {selectedPowerData && (
                <div style={{
                  background: `${selectedPowerData.color}22`,
                  border: `1px solid ${selectedPowerData.color}55`,
                  borderRadius: 14, padding: "14px 18px", marginBottom: 20, textAlign: "center",
                }}>
                  <span style={{ fontSize: 28 }}>{selectedPowerData.emoji}</span>
                  <div style={{ fontFamily: "'Fredoka One', cursive", color: "#fff", fontSize: 15, marginTop: 4 }}>
                    {name}'s Superpower: <span style={{ color: "#D4A017" }}>{selectedPowerData.label}</span>
                  </div>
                  <div style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", marginTop: 4 }}>
                    This power appears on every page of the adventure!
                  </div>
                </div>
              )}

              <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
                <MagicBtn onClick={() => setStep("power")} color="#555">← Edit</MagicBtn>
                <MagicBtn onClick={goToCheckout} big color="#D4A017">Get This Book — {CONFIG.PRICE_DISPLAY}</MagicBtn>
              </div>
            </Card>
          </div>
        )}

        {step === "checkout" && (
          <div style={{ animation: "pop 0.4s ease-out" }}>
            <Card glow>
              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 48 }}>📦</div>
                <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 26, color: "#D4A017", margin: "8px 0" }}>
                  Where should {name}'s book ship?
                </h2>
                <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 14, margin: 0 }}>
                  {CONFIG.PRICE_DISPLAY} — printed and shipped in 5-7 days
                </p>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <input placeholder="First name" value={shipping.firstName}
                  onChange={e => setShipping({ ...shipping, firstName: e.target.value })}
                  style={inputStyle} />
                <input placeholder="Last name" value={shipping.lastName}
                  onChange={e => setShipping({ ...shipping, lastName: e.target.value })}
                  style={inputStyle} />
              </div>
              <input placeholder="Email" type="email" value={shipping.email}
                onChange={e => setShipping({ ...shipping, email: e.target.value })}
                style={{ ...inputStyle, width: "100%", marginBottom: 10 }} />
              <input placeholder="Address line 1" value={shipping.addressLine1}
                onChange={e => setShipping({ ...shipping, addressLine1: e.target.value })}
                style={{ ...inputStyle, width: "100%", marginBottom: 10 }} />
              <input placeholder="Address line 2 (optional)" value={shipping.addressLine2}
                onChange={e => setShipping({ ...shipping, addressLine2: e.target.value })}
                style={{ ...inputStyle, width: "100%", marginBottom: 10 }} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
                <input placeholder="City" value={shipping.city}
                  onChange={e => setShipping({ ...shipping, city: e.target.value })}
                  style={inputStyle} />
                <input placeholder="State (e.g. NY)" value={shipping.state}
                  maxLength={2}
                  onChange={e => setShipping({ ...shipping, state: e.target.value.toUpperCase() })}
                  style={inputStyle} />
                <input placeholder="ZIP" value={shipping.postCode}
                  onChange={e => setShipping({ ...shipping, postCode: e.target.value })}
                  style={inputStyle} />
              </div>

              <div style={{
                background: "rgba(255,255,255,0.05)", borderRadius: 14, padding: 16, marginBottom: 16,
                border: "1px solid rgba(255,255,255,0.1)",
              }}>
                <div style={{ fontFamily: "'Fredoka One', cursive", color: "#D4A017", fontSize: 14, marginBottom: 10 }}>
                  PAYMENT
                </div>
                {clientSecretDebug && (
                  <p style={{ color: "rgba(255,255,255,0.4)", fontSize: 10, wordBreak: "break-all" }}>
                    debug: {clientSecretDebug}
                  </p>
                )}
                {!paymentElementReady && (
                  <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13 }}>Loading payment form...</p>
                )}
                <div ref={paymentDivRef}></div>
              </div>

              {orderStatus === "error" && (
                <div style={{
                  background: "rgba(192,57,43,0.2)", border: "1px solid rgba(192,57,43,0.5)",
                  borderRadius: 12, padding: "12px 16px", marginBottom: 16, fontSize: 14, color: "#fff",
                }}>
                  {orderError}
                </div>
              )}

              <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
                <MagicBtn onClick={() => { setPaymentElement(null); setPaymentElementReady(false); elementsRef.current = null; setStep("review"); }} color="#555">← Back</MagicBtn>
                <MagicBtn onClick={handlePay} big color="#D4A017" disabled={!clientSecret || !paymentElementReady || orderStatus === "processing"}>
                  {orderStatus === "processing" ? "Processing..." : `Pay ${CONFIG.PRICE_DISPLAY}`}
                </MagicBtn>
              </div>
            </Card>
          </div>
        )}

        {step === "done" && (
          <div style={{ textAlign: "center", animation: "pop 0.5s ease-out" }}>
            <Card glow>
              <div style={{ fontSize: 64, animation: "float 2s ease-in-out infinite" }}>💌</div>
              <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 30, color: "#D4A017", margin: "10px 0" }}>
                {name}'s book is on its way!
              </h2>
              <p style={{ color: "rgba(255,255,255,0.85)", fontSize: 17, lineHeight: 1.7 }}>
                Your order is confirmed and <strong style={{ color: "#fff" }}>"{name}'s Door"</strong> is
                being printed right now. A confirmation email is on its way to {shipping.email}.
              </p>

              {digitalBookUrl && (
                <a href={digitalBookUrl} target="_blank" rel="noopener noreferrer" style={{
                  display: "block", textDecoration: "none",
                  background: "linear-gradient(135deg, #D4A017, #F0C04E)",
                  color: "#1a0a2e", borderRadius: 18, padding: "20px", marginBottom: 20,
                  fontFamily: "'Fredoka One', cursive", fontSize: 18,
                  boxShadow: "0 8px 30px rgba(212,160,23,0.4)",
                }}>
                  📖 Read {name}'s Book Now
                  <div style={{ fontFamily: "'Nunito', sans-serif", fontWeight: 400, fontSize: 13, marginTop: 6, opacity: 0.8 }}>
                    Available anytime on your phone or tablet — no waiting for shipping!
                  </div>
                </a>
              )}

              {gelatoOrderId && (
                <div style={{
                  background: "rgba(212,160,23,0.1)", borderRadius: 16,
                  padding: "16px 20px", marginBottom: 20, fontSize: 14, color: "rgba(255,255,255,0.8)",
                }}>
                  Order ID: <strong style={{ color: "#D4A017" }}>{gelatoOrderId}</strong>
                </div>
              )}

              <div style={{
                background: "rgba(212,160,23,0.1)", borderRadius: 16,
                padding: "20px", marginBottom: 24, textAlign: "left"
              }}>
                <div style={{ fontFamily: "'Fredoka One', cursive", color: "#D4A017", fontSize: 15, marginBottom: 10 }}>
                  YOUR BOOK INCLUDES:
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {selectedRoomData.map(room => (
                    <div key={room.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
                      <span style={{ fontSize: 20 }}>{room.emoji}</span>
                      <span>A magical page in the <strong>{room.label}</strong></span>
                    </div>
                  ))}
                  <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
                    <span style={{ fontSize: 20 }}>{selectedPowerData?.emoji}</span>
                    <span>Superpower: <strong>{selectedPowerData?.label}</strong> throughout</span>
                  </div>
                </div>
              </div>

              <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
                <MagicBtn onClick={() => window.location.reload()} color="#555">
                  Make Another Book
                </MagicBtn>
              </div>

              <p style={{ color: "rgba(255,255,255,0.4)", fontSize: 13, marginTop: 20 }}>
                Wherever you are, your imagination can take you anywhere.
              </p>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
